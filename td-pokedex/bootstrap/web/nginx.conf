server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Le front appelle des URL relatives : /api est proxifie vers le conteneur
    # api. Meme origine cote navigateur, donc aucune question de CORS.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
